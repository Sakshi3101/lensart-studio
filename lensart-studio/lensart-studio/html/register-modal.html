<!-- ══════════ REGISTER MODAL ══════════ -->
<div class="modal-overlay" id="registerModal">
  <div class="modal-box">
    <button class="modal-close" onclick="closeModal('register')">×</button>
    <div class="modal-logo">LENS<span>ART</span></div>
    <div class="modal-subtitle">Create Your Account — Book with Ease</div>

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:1rem;">
      <div class="modal-form-group">
        <label>First Name</label>
        <input class="modal-input" type="text" placeholder="First name" id="regFirst">
      </div>
      <div class="modal-form-group">
        <label>Last Name</label>
        <input class="modal-input" type="text" placeholder="Last name" id="regLast">
      </div>
    </div>
    <div class="modal-form-group">
      <label>Email Address</label>
      <input class="modal-input" type="email" placeholder="you@example.com" id="regEmail">
    </div>
    <div class="modal-form-group">
      <label>Phone Number</label>
      <input class="modal-input" type="tel" placeholder="+91 00000 00000" id="regPhone">
    </div>
    <div class="modal-form-group">
      <label>Password</label>
      <input class="modal-input" type="password" placeholder="Create a strong password" id="regPass">
    </div>
    <button class="modal-submit" onclick="handleRegister()">Create Account</button>

    <div class="modal-divider">OR</div>
    <div class="modal-toggle">
      Already have an account? <a onclick="switchModal('register','login')">Login</a>
    </div>
  </div>
</div>
