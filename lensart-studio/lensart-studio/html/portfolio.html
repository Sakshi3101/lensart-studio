<!-- ══════════ PORTFOLIO ══════════ -->
<section id="portfolio">
  <div class="portfolio-header">
    <div>
      <div class="section-eyebrow reveal">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">Our Work</span>
      </div>
      <h2 class="section-title reveal">Visual <em>Masterpieces</em><br>We've Created</h2>
    </div>
    <div class="filter-tabs reveal">
      <button class="filter-tab active" onclick="filterGallery(this,'all')">All</button>
      <button class="filter-tab" onclick="filterGallery(this,'wedding')">Wedding</button>
      <button class="filter-tab" onclick="filterGallery(this,'event')">Events</button>
      <button class="filter-tab" onclick="filterGallery(this,'festival')">Festival</button>
      <button class="filter-tab" onclick="filterGallery(this,'portrait')">Portrait</button>
    </div>
  </div>

  <div class="portfolio-grid" id="portfolioGrid">
    <div class="port-item" data-category="wedding" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/eternal-vows.jpg" alt="Wedding Photography">
      <div class="port-overlay">
        <div class="port-info"><h4>Eternal Vows</h4><p>Wedding — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="event" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/corporate-gala.jpg" alt="Corporate Event">
      <div class="port-overlay">
        <div class="port-info"><h4>Corporate Gala</h4><p>Event — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="festival" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/holi-celebration.jpg" alt="Festival">
      <div class="port-overlay">
        <div class="port-info"><h4>Holi Celebration</h4><p>Festival — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="portrait" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/studio-portrait.jpg" alt="Portrait">
      <div class="port-overlay">
        <div class="port-info"><h4>Studio Portrait</h4><p>Portrait — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="wedding" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/sacred-union.jpg" alt="Wedding Ceremony">
      <div class="port-overlay">
        <div class="port-info"><h4>Sacred Union</h4><p>Wedding — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="festival" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/music-festival.jpg" alt="Festival Concert">
      <div class="port-overlay">
        <div class="port-info"><h4>Music Festival</h4><p>Festival — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="event" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/awards-night.jpg" alt="Event">
      <div class="port-overlay">
        <div class="port-info"><h4>Awards Night</h4><p>Event — 2024</p></div>
      </div>
    </div>
    <div class="port-item" data-category="wedding" onclick="openLightbox(this)">
      <img class="port-img" src="assets/images/portfolio/wedding-reception.jpg" alt="Wedding Reception">
      <div class="port-overlay">
        <div class="port-info"><h4>Wedding Reception</h4><p>Wedding — 2024</p></div>
      </div>
    </div>
  </div>
</section>
