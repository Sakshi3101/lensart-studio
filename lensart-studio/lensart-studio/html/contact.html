<!-- ══════════ CONTACT ══════════ -->
<section id="contact">
  <div class="portfolio-header" style="margin-bottom:3.5rem;">
    <div>
      <div class="section-eyebrow reveal">
        <div class="eyebrow-line"></div>
        <span class="eyebrow-text">Get In Touch</span>
      </div>
      <h2 class="section-title reveal">Let's Create<br>Something <em>Beautiful</em></h2>
    </div>
  </div>

  <div class="contact-layout">
    <div class="reveal">
      <div class="contact-detail">
        <div class="contact-icon"><img src="assets/icons/location.svg" alt="" width="20" height="20"></div>
        <div>
          <div class="contact-label">Studio Address</div>
          <div class="contact-value">LensArt Studio, Bandra West,<br>Mumbai, Maharashtra — 400050</div>
        </div>
      </div>
      <div class="contact-detail">
        <div class="contact-icon"><img src="assets/icons/phone.svg" alt="" width="20" height="20"></div>
        <div>
          <div class="contact-label">Phone</div>
          <div class="contact-value">+91 98765 43210</div>
        </div>
      </div>
      <div class="contact-detail">
        <div class="contact-icon"><img src="assets/icons/mail.svg" alt="" width="20" height="20"></div>
        <div>
          <div class="contact-label">Email</div>
          <div class="contact-value">hello@lensartstudio.in</div>
        </div>
      </div>
      <div class="contact-detail">
        <div class="contact-icon"><img src="assets/icons/clock.svg" alt="" width="20" height="20"></div>
        <div>
          <div class="contact-label">Working Hours</div>
          <div class="contact-value">Mon – Sat: 10:00 AM – 7:00 PM<br>Sunday by Appointment</div>
        </div>
      </div>

      <div style="margin-top:2rem;">
        <img src="assets/images/contact/studio.jpg" alt="Studio" style="width:100%;height:250px;object-fit:cover;filter:brightness(0.7) saturate(0.8);">
      </div>
    </div>

    <div class="contact-form reveal">
      <h3 class="form-title">Send an Enquiry</h3>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">First Name</label>
          <input class="form-input" type="text" placeholder="Your first name">
        </div>
        <div class="form-group">
          <label class="form-label">Last Name</label>
          <input class="form-input" type="text" placeholder="Your last name">
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Email Address</label>
        <input class="form-input" type="email" placeholder="you@example.com">
      </div>
      <div class="form-group">
        <label class="form-label">Phone Number</label>
        <input class="form-input" type="tel" placeholder="+91 00000 00000">
      </div>
      <div class="form-group">
        <label class="form-label">Event Type</label>
        <select class="form-select form-input">
          <option value="" disabled selected>Select event type</option>
          <option>Wedding Shoot</option>
          <option>Pre-Wedding Shoot</option>
          <option>Festival Photography</option>
          <option>Corporate Event</option>
          <option>Birthday / Party</option>
          <option>Portrait Session</option>
          <option>Other</option>
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Event Date</label>
        <input class="form-input" type="date">
      </div>
      <div class="form-group">
        <label class="form-label">Message</label>
        <textarea class="form-textarea form-input" placeholder="Tell us about your event, venue, and any special requirements..."></textarea>
      </div>
      <button class="pkg-btn pkg-btn-solid" style="font-size:0.72rem;letter-spacing:3px;" onclick="submitEnquiry()">Send Enquiry →</button>
    </div>
  </div>
</section>
